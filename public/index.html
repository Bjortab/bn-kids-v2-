<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BN’s Sagovärld – v2</title>
  <style>
    body{background:#111;color:#eaeaea;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:0;padding:24px}
    .panel{max-width:880px;margin:0 auto;background:#1b1b1b;border-radius:12px;padding:20px;box-shadow:0 0 0 1px #222}
    .row{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}
    .row>*{flex:1}
    label{display:block;font-size:13px;color:#9aa3ab;margin-bottom:6px}
    input,select,textarea,button{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #2b2b2b;background:#121212;color:#eee;outline:none}
    textarea{min-height:96px;resize:vertical}
    .btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
    .btn-primary{background:#14b8a6;border-color:#0d9488;color:#051515;font-weight:600}
    .btn-ghost{background:#0d0d0d}
    .muted{color:#97a1a8;font-size:13px}
    .audio{margin-top:8px}
    .spinner{display:none;gap:8px;align-items:center;color:#9aa3ab;font-size:14px}
    .dot{width:6px;height:6px;border-radius:50%;background:#9aa3ab;animation:b 1.4s infinite ease-in-out}
    .dot:nth-child(2){animation-delay:.15s}
    .dot:nth-child(3){animation-delay:.3s}
    @keyframes b{0%,80%,100%{opacity:.2;transform:scale(.85)}40%{opacity:1;transform:scale(1)}}
    pre#error{white-space:pre-wrap;background:#2a1111;border:1px solid #3b1c1c;padding:12px;border-radius:8px;color:#ffb4b4}
    #story{white-space:pre-wrap;line-height:1.5}
  </style>
</head>
<body>
  <div class="panel">
    <h1>BN’s Sagovärld · v2</h1>

    <div class="row">
      <div>
        <label>Ålder</label>
        <select id="age">
          <option>1–2 år</option>
          <option>3–4 år</option>
          <option>5–6 år</option>
          <option>7–8 år</option>
          <option>9–10 år</option>
          <option>11–12 år</option>
        </select>
      </div>
      <div>
        <label>Hjälte (valfritt)</label>
        <input id="hero" placeholder="t.ex. Taxen Tage, Draken Holger">
      </div>
    </div>

    <div class="row">
      <div>
        <label>Sagoprompt (skriv eller tala in)</label>
        <textarea id="prompt" placeholder="en modig tax i rymden 🚀"></textarea>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Röst (svenska)</label>
        <select id="voice">
          <option value="sv-SE-Wavenet-B">Auto (sv-SE-Wavenet-B)</option>
          <option value="sv-SE-Wavenet-A">sv-SE-Wavenet-A</option>
          <option value="sv-SE-Wavenet-B">sv-SE-Wavenet-B</option>
          <option value="sv-SE-Wavenet-C">sv-SE-Wavenet-C</option>
          <option value="sv-SE-Wavenet-D">sv-SE-Wavenet-D</option>
          <option value="sv-SE-Neural2-A">sv-SE-Neural2-A</option>
          <option value="sv-SE-Neural2-B">sv-SE-Neural2-B</option>
        </select>
      </div>
      <div>
        <label>Talthastighet</label>
        <select id="rate">
          <option value="1.0">Standard (1.0)</option>
          <option value="0.95">0.95</option>
          <option value="0.9">0.9</option>
          <option value="0.85">0.85</option>
          <option value="0.8">0.8</option>
          <option value="1.05">1.05</option>
          <option value="1.1">1.1</option>
          <option value="1.15">1.15</option>
          <option value="1.2">1.2</option>
        </select>
      </div>
      <div>
        <label>Pitch (semitoner)</label>
        <select id="pitch">
          <option value="0">0</option>
          <option value="-2">-2</option>
          <option value="-1">-1</option>
          <option value="1">+1</option>
          <option value="2">+2</option>
        </select>
      </div>
    </div>

    <div class="btns">
      <button id="btnSpeak" class="btn-ghost">Tala in</button>
      <button id="btnCreateRead" class="btn-primary">Skapa saga + uppläsning</button>
      <button id="btnSpeakOnly" class="btn-ghost">Spela igen</button>
      <button id="btnTestVoice" class="btn-ghost">Testa röst</button>
    </div>

    <div class="spinner" id="spinner" aria-live="polite">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <span>Arbetar…</span>
    </div>

    <pre id="error" style="display:none"></pre>

    <h3>Berättelse</h3>
    <div id="story" class="muted"></div>

    <div class="audio">
      <audio id="audio" controls></audio>
    </div>

    <p class="muted">Tips: “Skapa saga + uppläsning” skapar texten och läser upp i ett steg (samma som classic).</p>
  </div>

  <script src="./app.js"></script>
</body>
</html>
